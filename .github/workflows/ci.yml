name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test && npm run coverage:components
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with: {name: built-assets, path: src/django_shadcn/static/django_shadcn}
  django:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/download-artifact@v4
        with: {name: built-assets, path: src/django_shadcn/static/django_shadcn}
      - run: python -m pip install -e '.[dev]' 'Django~=${{ matrix.django }}.0'
      - run: python -m pytest && python -m ruff check src demo tests scripts
      - run: python -m build --no-isolation
      - run: python -m venv .cache/package-env && .cache/package-env/bin/pip install dist/*.whl && .cache/package-env/bin/python scripts/smoke_package.py
  postgres:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: shadcn}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env: {POSTGRES_DB: shadcn, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/download-artifact@v4
        with: {name: built-assets, path: src/django_shadcn/static/django_shadcn}
      - run: pip install -e '.[dev]' && python -m pytest
  browsers:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {name: built-assets, path: src/django_shadcn/static/django_shadcn}
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]' && .venv/bin/python demo/manage.py migrate && .venv/bin/python demo/manage.py seed_demo --password Demo-test-1234
      - run: npm ci && npx playwright install --with-deps && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: frontend/playwright-report}
