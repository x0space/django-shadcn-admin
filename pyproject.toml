[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-shadcn-admin"
dynamic = ["version"]
description = "A model-driven Django admin with shadcn React components and first-class RTL."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["django", "admin", "shadcn", "react", "rtl", "jalali"]
dependencies = ["Django>=5.2,<6.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/x0space/django-shadcn-admin"
Documentation = "https://github.com/x0space/django-shadcn-admin/blob/main/README.md"
Source = "https://github.com/x0space/django-shadcn-admin"
Issues = "https://github.com/x0space/django-shadcn-admin/issues"
Changelog = "https://github.com/x0space/django-shadcn-admin/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.11", "build>=1.2", "hatchling>=1.27", "ruff>=0.12", "psycopg[binary]>=3.2", "Pillow>=11"]
release = ["build>=1.2", "twine>=6.1"]

[tool.hatch.version]
path = "src/django_shadcn/__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_shadcn"]

[tool.hatch.build.targets.sdist]
include = ["src", "frontend", "demo", "tests", "docs", "scripts", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "hatch_build.py", "uv.lock", ".github"]
exclude = ["frontend/node_modules", "frontend/dist", "frontend/test-results", "frontend/playwright-report", "demo/db.sqlite3", "demo/media", "demo/staticfiles", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/settings.py" = ["F403", "F405"]
